<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Crates and processes</title>
  <desc id="dsc">The CLI depends on the core engine, and the frontends, the store and the artifact reader are the crates the core is used with. The core links no compiler API and does not depend on the artifact crate, so a source scan is complete without any artifact. Compiler evidence comes from separate helper binaries — one for Rust and one for Clang — reached over a versioned protocol with capability negotiation, a response deadline and crash isolation, so a compiler crash ends a helper process rather than the scan. Two make targets check both boundaries. A second lane in the same process is the time axis: the history crate reads the git history and nothing else, and the seam crate evaluates a seam ledger against it. Neither of the two depends on the core, so a source scan and a seam check share nothing but the command line.</desc>

  <style>
    .bg    { fill:#f6f8fa }
    .frame { fill:none; stroke:#d0d7de }
    .box   { fill:#ffffff; stroke:#d8dee4 }
    .box2  { fill:#f6f8fa; stroke:#d8dee4 }
    .ext   { fill:none; stroke:#afb8c1; stroke-dasharray:5 4 }
    .rule  { stroke:#e1e6eb }
    .ln    { fill:none; stroke:#0a5ca8; stroke-width:1.4 }
    .lnb   { fill:none; stroke:#8c959f; stroke-width:1.2 }
    .ah    { fill:#0a5ca8 }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .s     { font-size:10.5px; fill:#59636e }
    .xs    { font-size:9.5px; fill:#59636e }
    .lbl   { font-size:10.5px; fill:#59636e; letter-spacing:.08em }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
    .m11   { font-size:11px }
    .m95   { font-size:9.5px }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .frame{stroke:#30363d} .box{fill:#161b22;stroke:#30363d}
      .box2{fill:#11161c;stroke:#30363d} .ext{stroke:#484f58} .rule{stroke:#21262d}
      .ln{stroke:#79b8ff} .lnb{stroke:#6e7781} .ah{fill:#79b8ff}
      text{fill:#e6edf3} .s{fill:#8b949e} .xs{fill:#8b949e} .lbl{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="530" rx="12"/>

  <rect class="frame" x="24" y="56" width="584" height="398" rx="10"/>
  <text class="lbl" x="40" y="80">ONE PROCESS</text>

  <rect class="box" x="44" y="100" width="150" height="56" rx="8"/>
  <text class="mono m11" x="119" y="126" text-anchor="middle">codehelion</text>
  <text class="xs"       x="119" y="143" text-anchor="middle">the command line</text>

  <rect class="box" x="238" y="100" width="170" height="56" rx="8"/>
  <text class="mono m11" x="323" y="126" text-anchor="middle">codehelion-core</text>
  <text class="xs"       x="323" y="143" text-anchor="middle">the clone engine</text>

  <path class="ln" d="M194,128 L234,128" marker-end="url(#a)"/>

  <path class="lnb" d="M92,196 L556,196"/>
  <path class="ln"  d="M323,196 L323,160" marker-end="url(#a)"/>
  <path class="lnb" d="M92,196 L92,214 M196,196 L196,214 M300,196 L300,214 M404,196 L404,214 M508,196 L508,214"/>

  <rect class="box2" x="44"  y="214" width="96" height="44" rx="6"/>
  <text class="mono m95" x="92"  y="234" text-anchor="middle">frontend-rust</text>
  <text class="xs"       x="92"  y="250" text-anchor="middle">lexer · IR</text>
  <rect class="box2" x="148" y="214" width="96" height="44" rx="6"/>
  <text class="mono m95" x="196" y="234" text-anchor="middle">frontend-c</text>
  <text class="xs"       x="196" y="250" text-anchor="middle">lexer · IR</text>
  <rect class="box2" x="252" y="214" width="96" height="44" rx="6"/>
  <text class="mono m95" x="300" y="234" text-anchor="middle">frontend-cpp</text>
  <text class="xs"       x="300" y="250" text-anchor="middle">lexer · IR</text>
  <rect class="box2" x="356" y="214" width="96" height="44" rx="6"/>
  <text class="mono m95" x="404" y="234" text-anchor="middle">store</text>
  <text class="xs"       x="404" y="250" text-anchor="middle">SQLite</text>
  <rect class="box2" x="460" y="214" width="96" height="44" rx="6"/>
  <text class="mono m95" x="508" y="234" text-anchor="middle">artifact</text>
  <text class="xs"       x="508" y="250" text-anchor="middle">optional</text>

  <text class="s" x="44" y="292">The core links no compiler API, and does not depend on the artifact</text>
  <text class="s" x="44" y="310">crate: a source scan is complete with no artifact anywhere.</text>

  <path class="rule" d="M44,328 L588,328"/>
  <text class="lbl" x="44"  y="346">THE TIME AXIS</text>
  <text class="s"   x="164" y="346">asymmetric change, breach and co-change: the core is not on this path.</text>

  <path class="ln" d="M119,156 L119,176 L34,176 L34,362 L323,362 L323,374" marker-end="url(#a)"/>
  <path class="ln" d="M119,362 L119,374" marker-end="url(#a)"/>

  <rect class="box" x="44" y="378" width="150" height="56" rx="8"/>
  <text class="mono m11" x="119" y="404" text-anchor="middle">codehelion-seam</text>
  <text class="xs"       x="119" y="421" text-anchor="middle">the seam ledger</text>

  <rect class="box" x="238" y="378" width="170" height="56" rx="8"/>
  <text class="mono m11" x="323" y="404" text-anchor="middle">codehelion-history</text>
  <text class="xs"       x="323" y="421" text-anchor="middle">the git history</text>

  <path class="ln" d="M194,406 L234,406" marker-end="url(#a)"/>

  <text class="s" x="936" y="80" text-anchor="end">a versioned protocol · a deadline · crash isolation</text>

  <rect class="ext" x="632" y="100" width="304" height="86" rx="8"/>
  <text class="mono m11" x="648" y="128">codehelion-backend-rust</text>
  <text class="xs" x="648" y="148">a separate process, started only in Semantic mode</text>
  <text class="xs" x="648" y="166">types · name resolution · call targets</text>

  <rect class="ext" x="632" y="212" width="304" height="86" rx="8"/>
  <text class="mono m11" x="648" y="240">codehelion-backend-clang</text>
  <text class="xs" x="648" y="260">a separate process; needs a system libclang</text>
  <text class="xs" x="648" y="278">types · name resolution · call targets · MIR CFG</text>

  <path class="ln" d="M608,143 L628,143" marker-end="url(#a)"/>
  <path class="ln" d="M608,255 L628,255" marker-end="url(#a)"/>

  <text class="s" x="24" y="486">A compiler crash ends a helper process, not the scan: the run records that unit as unavailable and continues.</text>
  <text class="s" x="24" y="506">Both boundaries are checked, not just agreed: make verify-helper-boundaries and make verify-artifact-boundaries.</text>
</svg>
