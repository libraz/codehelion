name: Bug report
description: Something crashed, hung, or reported the wrong thing.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in what you have. A report missing half of this is still worth
        filing — the fields below are what usually makes a problem
        reproducible, not a form that has to be complete.

        If the problem is a security issue, close this and use private
        reporting instead — see
        [SECURITY.md](https://github.com/libraz/codehelion/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: report-header
    attributes:
      label: Report header
      description: >
        The header of the run, which records the file counts, the detector
        versions and every ceiling that fired. If the tree cannot be shared,
        the header on its own is still useful.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `codehelion --version`.
      placeholder: codehelion 0.1.0
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - fast
        - structural
        - semantic
        - not sure
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and version, and the CPU architecture.
      placeholder: macOS 15.5, arm64
  - type: textarea
    id: input-shape
    attributes:
      label: The tree being scanned
      description: >
        Language, rough size, anything unusual about it — generated code,
        vendored sources, symlinks, very large files. A link to the repository
        if it is public.
