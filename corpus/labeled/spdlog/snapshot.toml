schema_version = 1
origin = "https://github.com/gabime/spdlog.git"
commit = "79524ddd08a4ec981b7fea76afd08ee05f83755d"
# The library's own headers. `include/spdlog/fmt/bundled` is a second project
# vendored in whole, which says nothing about this one and would carry more
# lines than everything else here put together; the thin `fmt/*.h` wrappers
# over it go with it. Listed file by file rather than by glob because a git
# pathspec wildcard crosses directory boundaries and would take the vendored
# tree back.
paths = [
  "include/spdlog/cfg",
  "include/spdlog/details",
  "include/spdlog/sinks",
  "include/spdlog/async.h",
  "include/spdlog/async_logger-inl.h",
  "include/spdlog/async_logger.h",
  "include/spdlog/common-inl.h",
  "include/spdlog/common.h",
  "include/spdlog/formatter.h",
  "include/spdlog/fwd.h",
  "include/spdlog/logger-inl.h",
  "include/spdlog/logger.h",
  "include/spdlog/mdc.h",
  "include/spdlog/pattern_formatter-inl.h",
  "include/spdlog/pattern_formatter.h",
  "include/spdlog/spdlog-inl.h",
  "include/spdlog/spdlog.h",
  "include/spdlog/stopwatch.h",
  "include/spdlog/tweakme.h",
  "include/spdlog/version.h",
]
