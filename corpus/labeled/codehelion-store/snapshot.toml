# Where this case's sources come from. The sources themselves are not
# committed: `corpus/scripts/materialize-labeled.sh` reconstructs them into
# `snapshot/`, which is git-ignored. The commit is what makes the line ranges
# in labels.json meaningful, so it is never bumped in place.
schema_version = 1
origin = "https://github.com/libraz/codehelion.git"
commit = "f9db8ef204e59566a664f7533ceb7b2d129b8626"
# This project's own storage layer. Scoped to one crate so every group it
# reports can be read and ruled on.
paths = ["crates/codehelion-store/src"]
