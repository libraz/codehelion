[package]
name = "codehelion-backend-clang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Out-of-process C and C++ compiler helper for codehelion."

[dependencies]
codehelion-helper = { version = "0.4.0", path = "../codehelion-helper" }
# The compilation-database entry shape, which the scanner reads with the same
# code: an entry is named by the words it records, so the two readers cannot
# each have their own idea of where one word ends.
codehelion-helper-protocol = { version = "0.4.0", path = "../codehelion-helper-protocol" }
# Clang through libclang's stable C ABI, loaded at run time rather than linked.
# Loading it means this program builds on a machine that has no Clang and says
# so when started, which is what an optional component has to be able to do;
# linking the C++ API instead would pin a whole LLVM release into the binary
# and make installing the helper the harder half of installing the tool.
#
# No `clang_*` feature is enabled, so only the API every supported release has
# is compiled — the reason to talk to a compiler through a C ABI at all.
#
# Not `2`: tokenizing a range libclang returns nothing for reads the empty
# answer out of a null pointer, which is undefined behaviour and aborts the
# process where the check is compiled in. 2.1 asks whether the pointer is
# there. Nothing this helper can do at the call site prevents it — the answer
# arrives already read — so the floor is the version that reads it correctly.
clang = { version = "2.1", features = ["runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
codehelion-fixtures = { path = "../codehelion-fixtures" }
tempfile = "3"

[lints]
workspace = true
