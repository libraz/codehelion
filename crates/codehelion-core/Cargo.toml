[package]
name = "codehelion-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Engine and intermediate representation for the codehelion source-audit tool."

[dependencies]
blake3 = "1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
# Test scaffolding only, and itself free of codehelion dependencies: the
# fixtures are projects this crate is judged against, not code it links.
codehelion-fixtures = { path = "../codehelion-fixtures" }
tempfile = "3"

[[bench]]
name = "guardrail_work"
harness = false

[lints]
workspace = true
