[package]
name = "codehelion-backend-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Out-of-process Rust compiler helper for codehelion."

[dependencies]
codehelion-helper = { version = "0.4.0", path = "../codehelion-helper" }
# rust-analyzer as a library. Published from the same tree as the editor
# server, on a stable toolchain, and resolved by cargo like any other
# dependency — which is what a version bump costs here, instead of a nightly
# pin and an adapter per compiler release.
ra_ap_hir = "0.0.350"
ra_ap_ide_db = "0.0.350"
ra_ap_load-cargo = "0.0.350"
ra_ap_project_model = "0.0.350"
ra_ap_syntax = "0.0.350"
ra_ap_toolchain = "0.0.350"
ra_ap_vfs = "0.0.350"
tempfile = "3"

[dev-dependencies]
codehelion-fixtures = { path = "../codehelion-fixtures" }

[lints]
workspace = true
