[package]
name = "codehelion-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local duplicate-logic and compiled-artifact-bloat auditor for Rust, C and C++ codebases."
readme = "../../README.md"
keywords = ["clone-detection", "duplicate-code", "static-analysis", "audit", "rust"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "codehelion"
path = "src/main.rs"

[lib]
name = "codehelion_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codehelion-core = { version = "0.1.0", path = "../codehelion-core" }
codehelion-frontend-c = { version = "0.1.0", path = "../codehelion-frontend-c" }
codehelion-frontend-cpp = { version = "0.1.0", path = "../codehelion-frontend-cpp" }
codehelion-frontend-rust = { version = "0.1.0", path = "../codehelion-frontend-rust" }
codehelion-store = { version = "0.1.0", path = "../codehelion-store" }
globset = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
codehelion-store = { path = "../codehelion-store" }
predicates = "3"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
