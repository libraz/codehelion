[package]
name = "codehelion-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local duplicate-logic and compiled-artifact-bloat auditor for Rust, C and C++ codebases."
readme = "../../README.md"
keywords = ["clone-detection", "duplicate-code", "static-analysis", "audit", "rust"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "codehelion"
path = "src/main.rs"

[lib]
name = "codehelion_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codehelion-core = { version = "0.1.0", path = "../codehelion-core" }
codehelion-artifact = { version = "0.1.0", path = "../codehelion-artifact" }
codehelion-artifact-archive = { version = "0.1.0", path = "../codehelion-artifact-archive" }
codehelion-artifact-elf = { version = "0.1.0", path = "../codehelion-artifact-elf" }
codehelion-artifact-macho = { version = "0.1.0", path = "../codehelion-artifact-macho" }
codehelion-artifact-pe = { version = "0.1.0", path = "../codehelion-artifact-pe" }
codehelion-artifact-wasm = { version = "0.1.0", path = "../codehelion-artifact-wasm" }
# Only to look for helper programs and, later, to run them. The engine crates
# do not depend on this; the layer that starts processes does.
codehelion-helper = { version = "0.1.0", path = "../codehelion-helper" }
codehelion-frontend-c = { version = "0.1.0", path = "../codehelion-frontend-c" }
codehelion-frontend-cpp = { version = "0.1.0", path = "../codehelion-frontend-cpp" }
codehelion-frontend-rust = { version = "0.1.0", path = "../codehelion-frontend-rust" }
codehelion-store = { version = "0.1.0", path = "../codehelion-store" }
globset = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sourcemap = "9.3.2"
toml = "0.8"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["resource"] }

[dev-dependencies]
assert_cmd = "2"
boon = "0.6"
# The evaluation harness scores a scan report against the committed corpora.
# A dev-dependency: it measures the shipped binary from outside and is not
# part of it, so the released crate pulls in none of it.
codehelion-eval = { version = "0.1.0", path = "../codehelion-eval" }
# Plants a C or C++ tree with the compilation database that describes it, so a
# semantic scan can be run against a project rather than against a snippet.
codehelion-fixtures = { version = "0.1.0", path = "../codehelion-fixtures" }
codehelion-store = { version = "0.1.0", path = "../codehelion-store" }
predicates = "3"
serde_json = "1"

[lints]
workspace = true
