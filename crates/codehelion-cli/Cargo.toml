[package]
name = "codehelion-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local duplicate-logic and compiled-artifact-bloat auditor for Rust, C and C++ codebases."
readme = "../../README.md"
keywords = ["clone-detection", "duplicate-code", "static-analysis", "audit", "rust"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "codehelion"
path = "src/main.rs"

[lib]
name = "codehelion_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codehelion-core = { path = "../codehelion-core" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
