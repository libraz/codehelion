[package]
name = "codehelion-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local SQLite audit storage for the codehelion source-audit tool."

[dependencies]
codehelion-core = { version = "0.1.0", path = "../codehelion-core" }
codehelion-helper-protocol = { version = "0.1.0", path = "../codehelion-helper-protocol" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
