[package]
name = "codehelion-seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Evaluates a seam ledger against a local git history: asymmetric changes, breaches and co-change coupling."

[dependencies]
blake3 = "1"
codehelion-history = { version = "0.5.0", path = "../codehelion-history" }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# The tests serialise results twice and compare the bytes, which is the
# determinism check this crate exists to keep passing.
serde_json = "1"

[lints]
workspace = true
