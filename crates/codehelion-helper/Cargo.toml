[package]
name = "codehelion-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Process supervision, sandboxing, and server support for codehelion compiler helpers."

[dependencies]
codehelion-helper-protocol = { version = "0.3.0", path = "../codehelion-helper-protocol" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["process", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["resource"] }

[lints]
workspace = true
