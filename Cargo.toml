[package]
name = "codehelion"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local duplicate-logic and compiled-artifact-bloat auditor for Rust, C and C++ codebases."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/libraz/codehelion"
homepage = "https://github.com/libraz/codehelion"
keywords = ["clone-detection", "duplicate-code", "static-analysis", "audit", "rust"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "codehelion"
path = "src/main.rs"

[[bin]]
name = "codehelion-eval"
path = "src/bin/eval.rs"
required-features = ["eval"]

[lib]
name = "codehelion"
path = "src/lib.rs"

[features]
# Feature-gated development/CI evaluation harness. Off by default so the
# published `codehelion` binary does not pull in serde.
eval = ["dep:serde", "dep:serde_json"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Fail loudly on shortcuts that hide bugs.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
